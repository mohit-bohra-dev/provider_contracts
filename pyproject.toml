[project]
name = "provider-contracts"
version = "0.1.0"
description = "Shared abstract provider interfaces, DTOs, and reusable concrete implementations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pydantic>=2.7.0"]

[project.optional-dependencies]
openai        = ["openai>=1.30.0"]
anthropic     = ["anthropic>=0.28.0"]
bedrock       = ["aioboto3>=13.0.0", "types-aiobotocore-bedrock-runtime>=2.0.0"]
gemini        = ["google-genai>=1.0.0"]
ollama        = ["httpx>=0.27.0"]
redis         = ["redis>=5.0.0"]
r2            = ["boto3>=1.34.0"]
pgvector      = ["sqlalchemy[asyncio]>=2.0.0", "asyncpg>=0.29.0", "pgvector>=0.4.2"]
elevenlabs    = ["httpx>=0.27.0"]
whisper-local = ["faster-whisper>=1.1.1"]
webrtc-vad    = ["webrtcvad>=2.0.10"]
celery        = ["celery>=5.3.0"]
qdrant        = ["qdrant-client>=1.9.0"]
bge           = ["sentence-transformers>=3.0.0"]
presidio      = ["presidio-analyzer>=2.2.35", "presidio-anonymizer>=2.2.35"]
structlog     = ["structlog>=24.1.0"]
    reranker      = ["sentence-transformers>=3.0.0"]
    langfuse      = ["langfuse>=2.50"]
    all = [
    "provider-contracts[openai,anthropic,bedrock,gemini,ollama,redis,r2,pgvector,elevenlabs,whisper-local,webrtc-vad,celery,qdrant,bge,presidio,structlog,reranker,langfuse]",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
